  <path d="M144 194 L150 120 M336 194 L330 120" stroke="#cbbf9f" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M146 392 L334 392" stroke="#cbbf9f" stroke-width="2" stroke-dasharray="4 4"/>
