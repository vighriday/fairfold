<title id="title">Chain Matches: a synthetic hash-chain illustration</title><desc id="desc">Synthetic specimen only. Entry one stored hash a72d1b0639159b032e756c15617e841264e95b3184d232033b149b42cd13d83d. Entry two carries that same previous hash. Its hash is 83c719f9cf2b0aa40162c69ef181f687ab4d7d805006bcf043172f7351d86586. Both entries verify with production canonical JSON and SHA-256.</desc>
