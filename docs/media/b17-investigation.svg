<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">B17: from related complaints to a reviewed inspection</title><desc id="desc">Similar complaints are investigated against batch, courier, listing and packing context. Code computes exposure and corrected statistical tests. A hypothesis is not a verdict. Inspect stock; if a defect is confirmed, recommend a fair remedy. The merchant approves each action. The suspicion itself is not submitted as dispute evidence. Illustrated synthetic scenario; provider and real-photo acceptance are pending.</desc>
<rect x="0" y="0" width="960" height="640" rx="20" fill="#f6f3fa" stroke="#f6f3fa"/><text x="32" y="37" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" letter-spacing="1.4">UNFOLD THE B17 HYPOTHESIS</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="33" font-weight="600" fill="#19151f" >A pattern is a reason to inspect.</text><rect x="24" y="112" width="286" height="300" rx="20" fill="white" stroke="#dfd6ea"/><rect x="334" y="112" width="602" height="300" rx="20" fill="white" stroke="#dfd6ea"/><text x="44" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#19151f" >Similar complaints</text><rect x="44" y="176" width="246" height="49" rx="12" fill="#f6f3fa" stroke="#dfd6ea"/><text x="59" y="207" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >Seam complaint</text><rect x="44" y="241" width="246" height="49" rx="12" fill="#f6f3fa" stroke="#dfd6ea"/><text x="59" y="272" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >Another seam complaint</text><rect x="44" y="306" width="246" height="49" rx="12" fill="#f6f3fa" stroke="#dfd6ea"/><text x="59" y="337" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >A related report</text><text x="355" y="151" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#19151f" >Check the context, not just the wording</text><rect x="356" y="177" width="258" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="370" y="197" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >Batch B17?</text><rect x="637" y="177" width="258" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="651" y="197" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >Courier lane?</text><rect x="356" y="228" width="258" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="370" y="248" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >Listing?</text><rect x="637" y="228" width="258" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="651" y="248" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >Packing station?</text><text x="356" y="316" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Code checks exposure and alternative explanations.</text><text x="356" y="345" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Corrected statistical tests qualify a hypothesis.</text><rect x="356" y="367" width="293" height="29" rx="14" fill="#fff0cf" stroke="#fff0cf"/><text x="370" y="387" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#936715" >HYPOTHESIS, NOT A VERDICT</text><path d="M479 420v30m-7-7 7 7 7-7" fill="none" stroke="#9477b6" stroke-width="2"/><rect x="24" y="460" width="912" height="120" rx="20" fill="#19151f" stroke="#19151f"/><g transform="translate(41 475) scale(0.65)" fill="none" stroke="#625b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14H82l21 21v87H15Z" fill="white"/><path d="M82 14v21h21M30 48H86M30 61H72M30 75H63"/><circle cx="91" cy="96" r="25" fill="#fff0c8" stroke="#936715"/><path d="M91 80v16l9 6" stroke="#936715"/></g><text x="145" y="499" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#f6f3fa" >Inspect remaining stock. Review what the evidence supports.</text><text x="145" y="530" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#c8bdd5" >If a defect is confirmed, recommend a remedy rather than a defence.</text><text x="145" y="557" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#c8bdd5" >The merchant approves each action. Suspicion is not filed as evidence.</text><text x="32" y="616" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#19151f" >ILLUSTRATED SYNTHETIC SCENARIO / PROVIDER-BACKED SCAN AND REAL PHOTOS STILL PENDING</text>
</svg>
