<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">One Fairfold order, from checkout to a reviewed response</title><desc id="desc">Four illustrated moments: the buyer reads a Store Report; the merchant captures and seals packing proof; code tests repeated complaints for a possible common cause; the merchant reviews an exact response or remedy. PayPal decides disputes. Product flow illustration, not observed sandbox acceptance.</desc>
<rect x="0" y="0" width="1120" height="740" rx="24" fill="#f6f3fa" stroke="#f6f3fa"/><text x="32" y="36" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" letter-spacing="1.6">THE FAIRFOLD LOOP</text><text x="32" y="88" font-family="Arial,sans-serif" font-size="37" font-weight="600" fill="#19151f" >A promise. A parcel. A shared record.</text><rect x="32" y="126" width="512" height="262" rx="20" fill="white" stroke="#dfd6ea"/><rect x="52" y="144" width="174" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="66" y="164" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >01 / BEFORE PAYMENT</text><g transform="translate(49 209) scale(1.02)" fill="none" stroke="#625b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="19" y="4" width="82" height="119" rx="14" fill="white"/><path d="M47 15H73M32 37H88M32 49H69"/><path d="M33 78 47 65 60 72 83 56" stroke="#267154"/><rect x="31" y="91" width="58" height="20" rx="10" fill="#0070ba" stroke="none"/><path d="m51 100 6 5 11-11" stroke="white"/></g><text x="194" y="228" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#19151f" >Read before paying</text><text x="194" y="267" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Store facts and reviews.</text><text x="194" y="294" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >A human approves payment.</text><path d="M194 346H520" stroke="#dfd6ea"/><text x="194" y="370" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#7938df" >Buyer chooses.</text><rect x="576" y="126" width="512" height="262" rx="20" fill="white" stroke="#dfd6ea"/><rect x="596" y="144" width="174" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="610" y="164" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >02 / BEFORE DISPATCH</text><g transform="translate(593 209) scale(1.02)" fill="none" stroke="#625b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="112" height="99" rx="16" fill="white"/><path d="m42 29-21 14 13 24 13-7v36h29V60l12 7 13-24-23-14-9 10H51Z" fill="#ddd0ef"/><path d="M46 20H17v20M103 79v18H84" stroke="#7938df"/><circle cx="102" cy="110" r="16" fill="#e0f0e8" stroke="#267154"/><path d="m95 110 5 5 10-12" stroke="#267154"/></g><text x="738" y="228" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#19151f" >Record the packing</text><text x="738" y="267" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Capture, check and seal.</text><text x="738" y="294" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Link proof to the order.</text><path d="M738 346H1064" stroke="#dfd6ea"/><text x="738" y="370" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#7938df" >Merchant seals.</text><rect x="32" y="410" width="512" height="262" rx="20" fill="white" stroke="#dfd6ea"/><rect x="52" y="428" width="174" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="66" y="448" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >03 / ACROSS ORDERS</text><g transform="translate(49 493) scale(1.02)" fill="none" stroke="#625b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 33 86 63 27 100M87 63H118" stroke="#b096d6" stroke-dasharray="4 5"/><rect x="3" y="12" width="53" height="38" rx="10" fill="white"/><rect x="3" y="81" width="53" height="38" rx="10" fill="white"/><path d="M15 26H43M15 35H31M15 95H43M15 104H31"/><circle cx="88" cy="63" r="24" fill="#e7dbf7"/><path d="M78 63H98M88 53V73" stroke="#7938df"/></g><text x="194" y="512" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#19151f" >Connect complaints</text><text x="194" y="551" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Test a possible shared cause.</text><text x="194" y="578" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Inspect before concluding.</text><path d="M194 630H520" stroke="#dfd6ea"/><text x="194" y="654" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#7938df" >Code tests the pattern.</text><rect x="576" y="410" width="512" height="262" rx="20" fill="white" stroke="#dfd6ea"/><rect x="596" y="428" width="174" height="29" rx="14" fill="#eee5fa" stroke="#eee5fa"/><text x="610" y="448" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" >04 / WHEN DISPUTED</text><g transform="translate(593 493) scale(1.02)" fill="none" stroke="#625b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14H82l21 21v87H15Z" fill="white"/><path d="M82 14v21h21M30 48H86M30 61H72M30 75H63"/><circle cx="91" cy="96" r="25" fill="#fff0c8" stroke="#936715"/><path d="M91 80v16l9 6" stroke="#936715"/></g><text x="738" y="512" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#19151f" >Review the response</text><text x="738" y="551" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Evidence or a fair remedy.</text><text x="738" y="578" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#625b70" >Approve the exact action.</text><path d="M738 630H1064" stroke="#dfd6ea"/><text x="738" y="654" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#7938df" >PayPal decides disputes.</text><text x="32" y="710" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#625b70" >PRODUCT ILLUSTRATION / NOT A SANDBOX TRANSACTION</text>
</svg>
