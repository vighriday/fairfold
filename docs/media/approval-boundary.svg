<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="242" viewBox="0 0 1280 242" role="img" aria-labelledby="title desc">
<title id="title">AI stops at the human approval boundary</title><desc id="desc">Payment context becomes shared evidence and a grounded draft. The merchant must approve the exact action before Fairfold calls PayPal. Motion stops before that boundary; reduced-motion preference disables it.</desc>
<style>.pulse{stroke-dasharray:6 14;animation:move 4s linear infinite}@keyframes move{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect width="1280" height="242" rx="24" fill="#15131d"/>
<text x="32" y="35" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#bba0ff">THE APPROVAL BOUNDARY</text>
<path d="M250 112H1010" stroke="#56436d" stroke-width="2"/>
<path d="M250 112H760" stroke="#bba0ff" stroke-width="3" class="pulse"/>
<rect x="30" y="65" width="220" height="102" rx="15" fill="#24202f" stroke="#40374f"/><text x="46" y="88" font-family="monospace" font-size="11" letter-spacing="1" fill="#bba0ff">PAYPAL</text><text x="46" y="120" font-family="Arial,sans-serif" font-size="21" fill="#f3f1f6">Payment context</text><text x="46" y="146" font-family="Arial,sans-serif" font-size="13" fill="#b9b2c8">Capture + dispute IDs</text>
<rect x="280" y="65" width="220" height="102" rx="15" fill="#24202f" stroke="#40374f"/><text x="296" y="88" font-family="monospace" font-size="11" letter-spacing="1" fill="#bba0ff">FAIRFOLD</text><text x="296" y="120" font-family="Arial,sans-serif" font-size="21" fill="#f3f1f6">Shared evidence</text><text x="296" y="146" font-family="Arial,sans-serif" font-size="13" fill="#b9b2c8">Photos + hash chain</text>
<rect x="530" y="65" width="220" height="102" rx="15" fill="#24202f" stroke="#40374f"/><text x="546" y="88" font-family="monospace" font-size="11" letter-spacing="1" fill="#bba0ff">CODE + AI</text><text x="546" y="120" font-family="Arial,sans-serif" font-size="21" fill="#f3f1f6">A grounded draft</text><text x="546" y="146" font-family="Arial,sans-serif" font-size="13" fill="#b9b2c8">Rules + structured output</text>
<rect x="780" y="65" width="220" height="102" rx="15" fill="#332244" stroke="#d8ba59"/><text x="796" y="88" font-family="monospace" font-size="11" letter-spacing="1" fill="#bba0ff">MERCHANT</text><text x="796" y="120" font-family="Arial,sans-serif" font-size="21" fill="#f3f1f6">Human approval</text><text x="796" y="146" font-family="Arial,sans-serif" font-size="13" fill="#b9b2c8">Review the exact action</text>
<rect x="1030" y="65" width="220" height="102" rx="15" fill="#24202f" stroke="#40374f"/><text x="1046" y="88" font-family="monospace" font-size="11" letter-spacing="1" fill="#bba0ff">PAYPAL</text><text x="1046" y="120" font-family="Arial,sans-serif" font-size="21" fill="#f3f1f6">Action + decision</text><text x="1046" y="146" font-family="Arial,sans-serif" font-size="13" fill="#b9b2c8">PayPal decides disputes</text>
<text x="1020" y="191" font-family="monospace" font-size="11" fill="#e8ca74">ONLY AFTER APPROVAL</text><text x="32" y="220" font-family="Arial,sans-serif" font-size="12" fill="#aaa2ba">Architecture illustration • not transaction, signature or sandbox acceptance evidence.</text>
</svg>
