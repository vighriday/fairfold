<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">PayPal and Fairfold integration responsibilities</title><desc id="desc">PayPal owns create/capture, seller-protection context, tracking and disputes. Fairfold maps the capture, seals evidence, verifies webhook ingress, prepares a draft and records exact human approval before permitted execution. Every PayPal call goes through packages/paypal. Architecture illustration; real sandbox outcomes remain pending.</desc>
<rect x="0" y="0" width="960" height="650" rx="20" fill="#f6f3fa" stroke="#f6f3fa"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#7938df" letter-spacing="1.5">ONE PAYMENT, TWO RESPONSIBILITIES</text><text x="32" y="88" font-family="Arial,sans-serif" font-size="29" font-weight="600" fill="#19151f" >PayPal moves the money. Fairfold carries the context.</text><rect x="24" y="116" width="410" height="454" rx="20" fill="#e9f3fc" stroke="#c9e0f3"/><rect x="526" y="116" width="410" height="454" rx="20" fill="#eee6f8" stroke="#d9c7ef"/><text x="48" y="154" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#003087" >PayPal sandbox</text><text x="550" y="154" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#7938df" >Fairfold</text><text x="48" y="184" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >Payment and dispute authority</text><text x="550" y="184" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >Evidence and human review</text><rect x="40" y="211" width="378" height="49" rx="11" fill="white" stroke="#c9e0f3"/><rect x="542" y="211" width="378" height="49" rx="11" fill="white" stroke="#d9c7ef"/><text x="56" y="242" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#003087" >Create + capture</text><text x="558" y="242" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#19151f" >Order + capture mapping</text><path d="M518 236H441 M448 230 441 236l7 6" fill="none" stroke="#9477b6" stroke-width="2"/><rect x="40" y="279" width="378" height="49" rx="11" fill="white" stroke="#c9e0f3"/><rect x="542" y="279" width="378" height="49" rx="11" fill="white" stroke="#d9c7ef"/><text x="56" y="310" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#003087" >Seller protection + tracking</text><text x="558" y="310" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#19151f" >Pack seal + tracking job</text><path d="M518 304H441 M448 298 441 304l7 6" fill="none" stroke="#9477b6" stroke-width="2"/><rect x="40" y="347" width="378" height="49" rx="11" fill="white" stroke="#c9e0f3"/><rect x="542" y="347" width="378" height="49" rx="11" fill="white" stroke="#d9c7ef"/><text x="56" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#003087" >Verified webhook event</text><text x="558" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#19151f" >Receipt + reconciliation</text><path d="M441 372H518 M511 366 518 372l-7 6" fill="none" stroke="#9477b6" stroke-width="2"/><rect x="40" y="415" width="378" height="49" rx="11" fill="white" stroke="#c9e0f3"/><rect x="542" y="415" width="378" height="49" rx="11" fill="white" stroke="#d9c7ef"/><text x="56" y="446" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#003087" >Current dispute state</text><text x="558" y="446" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#19151f" >Evidence + remedy draft</text><path d="M441 440H518 M511 434 518 440l-7 6" fill="none" stroke="#9477b6" stroke-width="2"/><rect x="40" y="483" width="378" height="49" rx="11" fill="white" stroke="#c9e0f3"/><rect x="542" y="483" width="378" height="49" rx="11" fill="white" stroke="#d9c7ef"/><text x="56" y="514" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#003087" >Allowed action / capture refund</text><text x="558" y="514" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#19151f" >Exact merchant approval</text><path d="M518 508H441 M448 502 441 508l7 6" fill="none" stroke="#9477b6" stroke-width="2"/><text x="32" y="606" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#19151f" >Every PayPal call crosses packages/paypal. Every external action needs its required human approval.</text><text x="32" y="632" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#625b70" >INTEGRATION MAP / ACTUAL SANDBOX OUTCOMES REMAIN PENDING</text>
</svg>
