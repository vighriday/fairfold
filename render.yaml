databases:
  - name: fairfold-db
    databaseName: fairfold
    user: fairfold
    postgresMajorVersion: '16'
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: fairfold-api
    runtime: node
    plan: starter
    repo: https://github.com/vighriday/fairfold
    branch: main
    autoDeployTrigger: off
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    preDeployCommand: pnpm db:migrate
    initialDeployHook: pnpm seed
    startCommand: pnpm --filter @fairfold/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: fairfold-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: DEMO_TOKEN_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: google
      - key: AI_MODEL_VISION
        value: gemini-3.5-flash
      - key: AI_MODEL_TEXT
        value: gemini-3.5-flash-lite
      - key: AI_EMBEDDING_PROVIDER
        value: google
      - key: AI_MODEL_EMBEDDING
        value: gemini-embedding-2
      - key: CLUSTER_SIMILARITY
        value: '0.80'
      - key: SHARED_CAUSE_HORIZON_DAYS
        value: '14'
      - key: SHARED_CAUSE_MIN_COMPLAINTS
        value: '3'
      - key: SHARED_CAUSE_MIN_RATE_RATIO
        value: '3'
      - key: SHARED_CAUSE_MAX_Q
        value: '0.05'
  - type: worker
    name: fairfold-worker
    runtime: node
    plan: starter
    repo: https://github.com/vighriday/fairfold
    branch: main
    autoDeployTrigger: off
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm --filter @fairfold/worker start
    envVars:
      - key: APP_ENCRYPTION_KEY
        fromService:
          type: web
          name: fairfold-api
          envVarKey: APP_ENCRYPTION_KEY
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: fairfold-db
          property: connectionString
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        fromService:
          type: web
          name: fairfold-api
          envVarKey: GOOGLE_GENERATIVE_AI_API_KEY
      - key: AI_PROVIDER
        value: google
      - key: AI_MODEL_VISION
        value: gemini-3.5-flash
      - key: AI_MODEL_TEXT
        value: gemini-3.5-flash-lite
      - key: AI_EMBEDDING_PROVIDER
        value: google
      - key: AI_MODEL_EMBEDDING
        value: gemini-embedding-2
      - key: CLUSTER_SIMILARITY
        value: '0.80'
      - key: SHARED_CAUSE_HORIZON_DAYS
        value: '14'
      - key: SHARED_CAUSE_MIN_COMPLAINTS
        value: '3'
      - key: SHARED_CAUSE_MIN_RATE_RATIO
        value: '3'
      - key: SHARED_CAUSE_MAX_Q
        value: '0.05'
